name: Release

# Triggered by pushing a version tag (e.g. `npm version minor && git push --follow-tags`),
# not by every push to main -- a release stays a deliberate, separate step from merging.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Refuses to publish a tag that doesn't match package.json -- a tag
      # pushed against the wrong commit, or a manual mistake, must not
      # silently publish whatever version happens to be in package.json.
      # Runs before the (slower) build/test steps below, on the runner's
      # preinstalled node, so a bad tag fails fast instead of burning a
      # full npm ci + build + test cycle first.
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - uses: ./.github/actions/verify
        with:
          registry-url: "https://registry.npmjs.org"

      # Every release through v0.8.3 was published by hand, so tags here get
      # pushed after the fact -- against a version already on the registry,
      # where `npm publish` fails on a 403 version conflict. That turned tag
      # backfill into a guaranteed red run indistinguishable from a real
      # failure, and made re-running a partially-failed release destructive-
      # looking (ahood-cli#112). Checking first makes this job idempotent.
      #
      # Deliberately biased toward attempting the publish: only a clean exit
      # AND a non-empty version counts as "already there", so a network blip
      # falls through to `npm publish` and fails loudly on a genuine conflict,
      # rather than silently skipping a release that never happened.
      - name: Check whether this version is already on the registry
        id: registry
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if PUBLISHED="$(npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null)" && [ -n "$PUBLISHED" ]; then
            echo "${PKG_NAME}@${PKG_VERSION} is already published -- skipping publish."
            echo "already-published=true" >> "$GITHUB_OUTPUT"
          else
            echo "${PKG_NAME}@${PKG_VERSION} is not on the registry -- publishing."
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.registry.outputs.already-published != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
