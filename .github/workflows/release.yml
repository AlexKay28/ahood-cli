name: Release

# Triggered by pushing a version tag (e.g. `npm version minor && git push --follow-tags`),
# not by every push to main -- a release stays a deliberate, separate step from merging.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # write: the last step moves the `release` branch (ahood#1018 step B).
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the release-branch step below can check (and git
          # push can prove) that the move is a fast-forward.
          fetch-depth: 0

      # Refuses to publish a tag that doesn't match package.json -- a tag
      # pushed against the wrong commit, or a manual mistake, must not
      # silently publish whatever version happens to be in package.json.
      # Runs before the (slower) build/test steps below, on the runner's
      # preinstalled node, so a bad tag fails fast instead of burning a
      # full npm ci + build + test cycle first.
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # One tag publishes @ahood/cli AND @ahood/opencode-plugin (ahood#1009),
      # and the Codex and Claude Code plugins carry the same version
      # (ahood#1018): their /ahood commands run `npx -y @ahood/cli@<it>`.
      # `npm version` keeps all three in sync (the `version` hook); this
      # catches a hand edit before anything is published.
      - name: Verify every plugin version matches package.json
        run: node scripts/check-plugin-version.mjs

      - uses: ./.github/actions/verify
        with:
          registry-url: "https://registry.npmjs.org"

      # Every release through v0.8.3 was published by hand, so tags here get
      # pushed after the fact -- against a version already on the registry,
      # where `npm publish` fails on a 403 version conflict. That turned tag
      # backfill into a guaranteed red run indistinguishable from a real
      # failure, and made re-running a partially-failed release destructive-
      # looking (ahood-cli#112). Checking first makes this job idempotent.
      #
      # Deliberately biased toward attempting the publish: only a clean exit
      # AND a non-empty version counts as "already there", so a network blip
      # falls through to `npm publish` and fails loudly on a genuine conflict,
      # rather than silently skipping a release that never happened.
      - name: Check whether this version is already on the registry
        id: registry
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if PUBLISHED="$(npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null)" && [ -n "$PUBLISHED" ]; then
            echo "${PKG_NAME}@${PKG_VERSION} is already published -- skipping publish."
            echo "already-published=true" >> "$GITHUB_OUTPUT"
          else
            echo "${PKG_NAME}@${PKG_VERSION} is not on the registry -- publishing."
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.registry.outputs.already-published != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The opencode plugin (ahood#1009), published after the CLI from the same
      # tag at the same version, with the same idempotent check: a re-run after
      # a partial release publishes whichever of the two is still missing.
      # --access public because a scoped package's first publish defaults to
      # restricted. NPM_TOKEN must be allowed to publish @ahood/opencode-plugin
      # (a granular token limited to @ahood/cli gets a 403 here).
      - name: Build @ahood/opencode-plugin
        run: npm run build:opencode-plugin

      - name: Check whether @ahood/opencode-plugin is already on the registry
        id: plugin-registry
        working-directory: packages/opencode-plugin
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if PUBLISHED="$(npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null)" && [ -n "$PUBLISHED" ]; then
            echo "${PKG_NAME}@${PKG_VERSION} is already published -- skipping publish."
            echo "already-published=true" >> "$GITHUB_OUTPUT"
          else
            echo "${PKG_NAME}@${PKG_VERSION} is not on the registry -- publishing."
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.plugin-registry.outputs.already-published != 'true'
        working-directory: packages/opencode-plugin
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The stable channel (ahood#1018 step B): Claude Code and Codex install
      # and auto-update the plugin from the `release` branch, never from
      # `main`, so a commit on main without a release reaches no one and every
      # release reaches everyone. Runs only after both publishes above
      # succeeded (or were already done), so the branch never points at a
      # version npm does not have.
      #
      # Never forced: a plain push of the tag's commit is a fast-forward or it
      # fails. The first run creates the branch. A re-run of an older tag, whose
      # commit the branch already contains, leaves it where it is.
      - name: Fast-forward the release branch to this tag
        run: node scripts/release-branch.mjs
